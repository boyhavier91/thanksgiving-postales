<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Thanksgiving 🦃</title>
<meta name="description" content="A Thanksgiving card made just for you.">
<meta property="og:title" content="Happy Thanksgiving 🦃🍂">
<meta property="og:description" content="A card made just for you · Una postal hecha para ti">
<meta property="og:type" content="website">
<meta property="og:image" content="https://boyhavier91.github.io/thanksgiving-postales/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#3b1d2e">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700;900&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-1: #2a1530; --sky-2: #5b2338; --sky-3: #b5462a; --sky-4: #f0a04b;
    --paper: #fff8ec; --ink: #4a2412; --accent: #c2410c; --gold: #c99a3b; --muted: #8a5a3c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 38%, var(--sky-3) 75%, var(--sky-4) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Nunito", system-ui, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    min-height: 100svh;
  }
  .glow {
    position: fixed; left: 50%; bottom: -30vh; width: 140vmax; height: 80vmax; transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(255, 196, 110, .55) 0%, rgba(255, 150, 60, .18) 35%, transparent 65%);
    pointer-events: none; animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: .75; transform: translateX(-50%) scale(1.04); } }
  .stars { position: fixed; inset: 0 0 50% 0; pointer-events: none; }
  .stars i {
    position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff3d6;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle { 50% { opacity: .15; } }

  /* Falling leaves */
  #leaves { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .leaf { position: absolute; top: -60px; will-change: transform; animation: fall linear forwards; }
  .leaf svg { display: block; animation: sway ease-in-out infinite alternate; }
  @keyframes fall { to { transform: translate3d(var(--drift), 112vh, 0) rotate(var(--spin)); } }
  @keyframes sway { from { transform: translateX(-18px) rotate(-25deg); } to { transform: translateX(18px) rotate(25deg); } }

  .stage {
    position: relative; z-index: 2; min-height: 100svh; display: grid; place-items: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  }

  /* Envelope */
  .envelope-wrap { display: grid; justify-items: center; gap: 22px; cursor: pointer; animation: float 3.2s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .envelope {
    position: relative; width: min(78vw, 330px); aspect-ratio: 1.55; perspective: 900px;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,.35));
  }
  .env-back, .env-front, .env-flap { position: absolute; inset: 0; border-radius: 10px; }
  .env-back { background: #d9a86a; }
  .env-peek {
    position: absolute; left: 7%; right: 7%; top: 8%; height: 80%; background: var(--paper); border-radius: 6px;
    transition: transform .8s cubic-bezier(.2,.8,.2,1) .35s;
  }
  .env-front {
    background: linear-gradient(160deg, #f0c98f, #e3b072);
    clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
  }
  .env-flap {
    background: linear-gradient(180deg, #e8b878, #d79a55);
    clip-path: polygon(0 0, 100% 0, 50% 58%);
    transform-origin: top center; transition: transform .6s ease-in; z-index: 3;
  }
  .seal {
    position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; transform: translate(-50%, -50%);
    border-radius: 50%; background: radial-gradient(circle at 35% 35%, #d9402b, #8f1d12 70%);
    display: grid; place-items: center; font-size: 22px; z-index: 4;
    box-shadow: 0 3px 8px rgba(0,0,0,.35), inset 0 -3px 6px rgba(0,0,0,.3);
    transition: transform .4s ease, opacity .3s ease;
  }
  .env-to {
    position: absolute; left: 0; right: 0; bottom: 4%; text-align: center; z-index: 2;
    font-family: "Great Vibes", cursive; font-size: clamp(26px, 8vw, 34px); color: #6b3412;
  }
  .tap {
    color: #ffe7c4; font-weight: 600; letter-spacing: .04em; font-size: 15px;
    padding: 10px 20px; border: 1px solid rgba(255, 231, 196, .5); border-radius: 999px;
    background: rgba(42, 21, 48, .35); backdrop-filter: blur(4px);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.05); background: rgba(42,21,48,.5); } }
  .opening .env-flap { transform: rotateX(180deg); z-index: 0; }
  .opening .seal { transform: translate(-50%, -50%) scale(0); opacity: 0; }
  .opening .env-peek { transform: translateY(-40%); }
  .opening.envelope-wrap { animation: none; }
  .gone { animation: drop .6s ease-in forwards !important; }
  @keyframes drop { to { transform: translateY(40vh) scale(.8); opacity: 0; } }

  /* Card */
  .card {
    width: min(92vw, 430px); background: var(--paper); border-radius: 18px; position: relative;
    padding: 26px 24px 26px; text-align: center; display: none;
    box-shadow: 0 30px 60px rgba(30, 8, 20, .45), 0 0 0 1px rgba(201, 154, 59, .25);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(240, 160, 75, .10), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(194, 65, 12, .08), transparent 45%);
  }
  .card::before {
    content: ""; position: absolute; inset: 10px; border: 1.5px solid rgba(201, 154, 59, .55); border-radius: 12px; pointer-events: none;
  }
  .card.show { display: block; animation: rise .9s cubic-bezier(.2,.9,.25,1.15) both; }
  @keyframes rise { from { transform: translateY(30px) scale(.85) rotate(-2deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .art { width: 100%; max-width: 300px; height: auto; margin: 0 auto 4px; display: block; }
  .art .pumpkin { transform-box: fill-box; transform-origin: bottom center; }
  .card.show .art .pumpkin { animation: bounceIn .7s cubic-bezier(.3,1.6,.5,1) both; }
  .card.show .art .p2 { animation-delay: .15s; } .card.show .art .p3 { animation-delay: .3s; }
  @keyframes bounceIn { from { transform: scale(0); } }
  .card.show .art .sprig { animation: fadeIn .8s ease .5s both; }

  .happy {
    font-family: "Great Vibes", cursive; color: var(--accent); font-size: clamp(44px, 14vw, 60px); line-height: 1; margin-top: 4px;
  }
  .thanks {
    font-family: "Playfair Display", serif; font-weight: 900; color: var(--ink);
    font-size: clamp(30px, 10.5vw, 46px); letter-spacing: .01em; line-height: 1.05; white-space: nowrap;
  }
  .ch { display: inline-block; opacity: 0; }
  .card.show .happy .ch { animation: dropIn .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay: calc(.6s + var(--i) * 70ms); }
  .card.show .thanks .ch { animation: riseIn .55s cubic-bezier(.2,1.4,.4,1) both; animation-delay: calc(1.1s + var(--i) * 55ms); }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-40px) rotate(-12deg); } to { opacity: 1; transform: none; } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(24px) scale(.6); } to { opacity: 1; transform: none; } }
  .card.show .thanks { animation: shimmer 2.2s ease 2.1s both; }
  @keyframes shimmer { 40% { text-shadow: 0 0 18px rgba(240, 160, 75, .8); } }

  .divider { display: block; width: 120px; height: 14px; margin: 12px auto 8px; opacity: 0; }
  .card.show .divider { animation: fadeIn .6s ease 2s both; }

  .name {
    font-family: "Great Vibes", cursive; color: #9a3412; font-size: clamp(42px, 13vw, 58px); line-height: 1.15;
    clip-path: inset(0 100% 0 0); padding: 0 8px; display: block; width: fit-content; margin: 0 auto; max-width: 100%;
  }
  .card.show .name { animation: write 1.6s ease-in-out 2.3s forwards; }
  @keyframes write { to { clip-path: inset(0 -10% 0 0); } }

  .dedication { font-size: 17px; line-height: 1.55; color: #5c3420; margin: 10px 6px 0; min-height: 0; }
  .w { display: inline-block; opacity: 0; white-space: pre; }
  .card.show .w { animation: wordIn .5s ease both; animation-delay: calc(3.8s + var(--i) * 75ms); }
  @keyframes wordIn { from { opacity: 0; transform: translateY(8px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }

  .signature { font-family: "Great Vibes", cursive; font-size: 30px; color: var(--accent); margin-top: 12px; opacity: 0; }
  .card.show .signature { animation: fadeIn .9s ease both; animation-delay: var(--sig-delay, 4.4s); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .actions { margin-top: 18px; display: flex; justify-content: center; gap: 10px; opacity: 0; }
  .card.show .actions { animation: fadeIn .6s ease both; animation-delay: calc(var(--sig-delay, 4.4s) + .8s); }
  .actions button {
    font: 600 14px "Nunito", sans-serif; color: var(--muted); background: transparent; border: 1px solid rgba(138, 90, 60, .35);
    padding: 8px 16px; border-radius: 999px; cursor: pointer;
  }
  .actions button:active { transform: scale(.96); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
    .name { clip-path: none; }
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="stars" id="stars"></div>
<div id="leaves"></div>

<main class="stage">
  <div class="envelope-wrap" id="envWrap" role="button" tabindex="0" aria-label="Open card">
    <div class="envelope">
      <div class="env-back"></div>
      <div class="env-peek"></div>
      <div class="env-front"></div>
      <div class="env-flap"></div>
      <div class="seal">🍁</div>
      <div class="env-to" id="envTo"></div>
    </div>
    <div class="tap" id="tapLabel">Tap to open</div>
  </div>

  <article class="card" id="card" aria-live="polite">
    <svg class="art" viewBox="0 0 300 120" aria-hidden="true">
      <g class="sprig">
        <path d="M30 100 C 60 60, 90 50, 120 70" stroke="#a16207" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M270 100 C 240 60, 210 50, 180 70" stroke="#a16207" stroke-width="3" fill="none" stroke-linecap="round"/>
        <g fill="#d97706"><ellipse cx="55" cy="74" rx="9" ry="4" transform="rotate(-35 55 74)"/><ellipse cx="75" cy="62" rx="9" ry="4" transform="rotate(-25 75 62)"/><ellipse cx="97" cy="58" rx="9" ry="4" transform="rotate(-5 97 58)"/></g>
        <g fill="#d97706"><ellipse cx="245" cy="74" rx="9" ry="4" transform="rotate(35 245 74)"/><ellipse cx="225" cy="62" rx="9" ry="4" transform="rotate(25 225 62)"/><ellipse cx="203" cy="58" rx="9" ry="4" transform="rotate(5 203 58)"/></g>
        <path transform="translate(14 84) rotate(-20) scale(1.1)" d="M12 0 l2.2 5.2 l3.6 -1.6 l-1 4.4 l4.6 -.4 l-3 3.4 l3.4 2.4 l-5.2 .6 l.8 4.4 l-4.2 -2.6 l-.6 4.8 h-1.2 l-.6 -4.8 l-4.2 2.6 l.8 -4.4 l-5.2 -.6 l3.4 -2.4 l-3 -3.4 l4.6 .4 l-1 -4.4 l3.6 1.6 z" fill="#b91c1c"/>
        <path transform="translate(262 78) rotate(20) scale(1.1)" d="M12 0 l2.2 5.2 l3.6 -1.6 l-1 4.4 l4.6 -.4 l-3 3.4 l3.4 2.4 l-5.2 .6 l.8 4.4 l-4.2 -2.6 l-.6 4.8 h-1.2 l-.6 -4.8 l-4.2 2.6 l.8 -4.4 l-5.2 -.6 l3.4 -2.4 l-3 -3.4 l4.6 .4 l-1 -4.4 l3.6 1.6 z" fill="#c2410c"/>
      </g>
      <g class="pumpkin p1">
        <ellipse cx="105" cy="92" rx="34" ry="24" fill="#ea580c"/>
        <ellipse cx="105" cy="92" rx="14" ry="24" fill="#f97316"/>
        <path d="M80 92 q25 -30 50 0" stroke="#c2410c" stroke-width="2" fill="none" opacity=".5"/>
        <rect x="102" y="62" width="6" height="10" rx="2" fill="#65a30d"/>
      </g>
      <g class="pumpkin p2">
        <ellipse cx="160" cy="88" rx="42" ry="30" fill="#f97316"/>
        <ellipse cx="160" cy="88" rx="18" ry="30" fill="#fb923c"/>
        <ellipse cx="160" cy="88" rx="32" ry="30" fill="none" stroke="#ea580c" stroke-width="2" opacity=".6"/>
        <path d="M158 58 q2 -10 8 -12" stroke="#4d7c0f" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M166 54 q14 -6 18 4 q-10 4 -18 -4" fill="#65a30d"/>
      </g>
      <g class="pumpkin p3">
        <ellipse cx="212" cy="98" rx="24" ry="17" fill="#fbbf24"/>
        <ellipse cx="212" cy="98" rx="9" ry="17" fill="#fcd34d"/>
        <rect x="210" y="77" width="5" height="8" rx="2" fill="#65a30d"/>
      </g>
    </svg>

    <div class="happy" id="happy"></div>
    <div class="thanks" id="thanks"></div>
    <svg class="divider" viewBox="0 0 120 14" aria-hidden="true">
      <path d="M2 7 H48 M72 7 H118" stroke="#c99a3b" stroke-width="1.5"/>
      <path d="M60 1 l3 5 l5 1 l-5 1 l-3 5 l-3 -5 l-5 -1 l5 -1 z" fill="#c2410c"/>
    </svg>
    <div class="name" id="name"></div>
    <p class="dedication" id="dedication"></p>
    <div class="signature" id="signature"></div>
    <div class="actions"><button id="replay" type="button">↻ <span id="replayLabel">Replay</span></button></div>
  </article>
</main>

<script src="config.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const code = (params.get("c") || "").trim();
  const preview = params.get("preview") === "1";
  const cfg = window.APP_CONFIG;
  const $ = (id) => document.getElementById(id);

  const LABELS = {
    en: { tap: "Tap to open", replay: "Replay", to: "For you", aria: "Open card" },
    es: { tap: "Toca para abrir", replay: "Ver de nuevo", to: "Para ti", aria: "Abrir postal" },
  };

  // Stars
  const stars = $("stars");
  for (let i = 0; i < 40; i++) {
    const s = document.createElement("i");
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    s.style.animationDelay = (Math.random() * 3).toFixed(2) + "s";
    s.style.opacity = (0.3 + Math.random() * 0.7).toFixed(2);
    stars.appendChild(s);
  }

  // Leaves
  const LEAF_COLORS = ["#c2410c", "#ea580c", "#f59e0b", "#b45309", "#dc2626", "#d97706", "#92400e"];
  const MAPLE = "M12 0 l2.2 5.2 l3.6 -1.6 l-1 4.4 l4.6 -.4 l-3 3.4 l3.4 2.4 l-5.2 .6 l.8 4.4 l-4.2 -2.6 l-.6 4.8 h-1.2 l-.6 -4.8 l-4.2 2.6 l.8 -4.4 l-5.2 -.6 l3.4 -2.4 l-3 -3.4 l4.6 .4 l-1 -4.4 l3.6 1.6 z";
  const OAK = "M12 0 C 16 4, 18 8, 15 11 C 19 12, 19 16, 14 16 C 16 20, 13 22, 12 24 C 11 22, 8 20, 10 16 C 5 16, 5 12, 9 11 C 6 8, 8 4, 12 0 z";
  const leavesEl = $("leaves");
  function spawnLeaf(burst) {
    const el = document.createElement("div");
    el.className = "leaf";
    const size = 16 + Math.random() * 22;
    const dur = burst ? 3 + Math.random() * 3 : 7 + Math.random() * 7;
    el.style.left = (burst ? 30 + Math.random() * 40 : Math.random() * 100) + "vw";
    if (burst) el.style.top = "30vh";
    el.style.setProperty("--drift", (Math.random() * 30 - 15) + "vw");
    el.style.setProperty("--spin", (Math.random() * 720 - 360) + "deg");
    el.style.animationDuration = dur + "s";
    const color = LEAF_COLORS[(Math.random() * LEAF_COLORS.length) | 0];
    const path = Math.random() < 0.65 ? MAPLE : OAK;
    el.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="animation-duration:${(1.6 + Math.random() * 1.8).toFixed(2)}s"><path d="${path}" fill="${color}" opacity=".92"/><path d="M12 6 V24" stroke="rgba(0,0,0,.25)" stroke-width=".8"/></svg>`;
    leavesEl.appendChild(el);
    setTimeout(() => el.remove(), dur * 1000 + 200);
  }
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce) {
    for (let i = 0; i < 10; i++) setTimeout(() => spawnLeaf(false), i * 400);
    setInterval(() => { if (!document.hidden && leavesEl.childElementCount < 34) spawnLeaf(false); }, 650);
  }
  function burst(n) { if (!reduce) for (let i = 0; i < n; i++) setTimeout(() => spawnLeaf(true), i * 40); }

  function splitChars(el, text) {
    el.textContent = "";
    [...text].forEach((ch, i) => {
      const s = document.createElement("span");
      s.className = "ch";
      s.style.setProperty("--i", i);
      s.textContent = ch === " " ? " " : ch;
      el.appendChild(s);
    });
  }
  function splitWords(el, text) {
    el.textContent = "";
    const words = text.split(/(\s+)/);
    let i = 0;
    words.forEach((w) => {
      if (/^\s+$/.test(w)) { el.appendChild(document.createTextNode(" ")); return; }
      if (!w) return;
      const s = document.createElement("span");
      s.className = "w";
      s.style.setProperty("--i", i++);
      s.textContent = w;
      el.appendChild(s);
    });
    return i;
  }
  function fitName(el) {
    // shrink long names so they stay on one or two lines
    const len = el.textContent.length;
    if (len > 14) el.style.fontSize = "clamp(34px, 10vw, 46px)";
    if (len > 22) el.style.fontSize = "clamp(28px, 8vw, 38px)";
  }

  let data = { display_name: "", dedication: "", lang: "en", signature: "" };

  function render() {
    const L = LABELS[data.lang] || LABELS.en;
    document.documentElement.lang = data.lang;
    $("tapLabel").textContent = L.tap;
    $("replayLabel").textContent = L.replay;
    $("envWrap").setAttribute("aria-label", L.aria);
    $("envTo").textContent = data.display_name || L.to;
    splitChars($("happy"), "Happy");
    splitChars($("thanks"), "Thanksgiving");
    $("name").textContent = data.display_name || "";
    $("name").style.display = data.display_name ? "block" : "none";
    fitName($("name"));
    const wordCount = data.dedication ? splitWords($("dedication"), data.dedication) : 0;
    $("dedication").style.display = data.dedication ? "block" : "none";
    const sigDelay = data.dedication ? 3.8 + wordCount * 0.075 + 0.6 : 4.0;
    $("card").style.setProperty("--sig-delay", sigDelay.toFixed(2) + "s");
    $("signature").textContent = data.signature ? "— " + data.signature : "";
    $("signature").style.display = data.signature ? "block" : "none";
  }

  function openCard() {
    const wrap = $("envWrap");
    if (wrap.classList.contains("opening")) return;
    wrap.classList.add("opening");
    setTimeout(() => wrap.classList.add("gone"), 1000);
    setTimeout(() => {
      wrap.style.display = "none";
      $("card").classList.add("show");
      burst(26);
    }, 1550);
  }
  function replay() {
    const card = $("card");
    card.classList.remove("show");
    void card.offsetWidth;
    card.classList.add("show");
    burst(20);
  }

  $("envWrap").addEventListener("click", openCard);
  $("envWrap").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openCard(); } });
  $("replay").addEventListener("click", replay);

  async function load() {
    if (params.get("demo") === "1") {
      data = { display_name: "María", lang: "es", signature: "Con cariño, Javier",
        dedication: "Gracias por estar siempre ahí, por las risas y los cafés de los domingos. Que esta mesa esté llena de amor y de tus postres favoritos." };
      render(); return;
    }
    if (!code) { render(); return; }
    try {
      const res = await fetch(cfg.SUPABASE_URL + "/rest/v1/rpc/open_card", {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: cfg.SUPABASE_ANON_KEY, Authorization: "Bearer " + cfg.SUPABASE_ANON_KEY },
        body: JSON.stringify({ p_code: code, p_track: !preview }),
      });
      const rows = res.ok ? await res.json() : [];
      if (rows && rows[0]) data = Object.assign(data, rows[0]);
    } catch (e) { /* show the generic card */ }
    data.dedication = data.dedication || "";
    data.signature = data.signature || "";
    render();
  }
  render();
  load();
})();
</script>
</body>
</html>
