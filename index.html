<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    --page-bg: linear-gradient(180deg, #2a1530 0%, #5b2338 38%, #b5462a 75%, #f0a04b 100%);
    --paper: #fff8ec; --ink: #4a2412; --accent: #c2410c; --name: #9a3412; --body: #5c3420; --muted: #8a5a3c;
    --env-a: #f0c98f; --env-b: #e3b072; --env-back: #d9a86a; --flap-a: #e8b878; --flap-b: #d79a55; --seal-a: #d9402b; --seal-b: #8f1d12; --env-ink: #6b3412;
    --tap-ink: #ffe7c4;
    background: var(--page-bg); background-attachment: fixed;
    color: var(--ink); font-family: "Nunito", system-ui, sans-serif;
    overflow: hidden; -webkit-tap-highlight-color: transparent; min-height: 100svh;
  }
  .hidden { display: none !important; }
  #scene { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .stage {
    position: relative; z-index: 2; min-height: 100svh; display: grid; place-items: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  }

  /* ---------- shared scene pieces ---------- */
  .glow {
    position: absolute; left: 50%; bottom: -30vh; width: 140vmax; height: 80vmax; transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(255, 196, 110, .55) 0%, rgba(255, 150, 60, .18) 35%, transparent 65%);
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: .75; transform: translateX(-50%) scale(1.04); } }
  .stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff3d6; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .15; } }
  .lights { position: absolute; top: 0; left: -2%; width: 104%; height: 90px; }
  .lights circle { animation: bulb 2.4s ease-in-out infinite; }
  @keyframes bulb { 50% { opacity: .45; } }
  .bokeh i { position: absolute; border-radius: 50%; filter: blur(6px); animation: drift 9s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(20px, -30px); } }

  /* ---------- particles ---------- */
  .pt { position: absolute; top: -60px; will-change: transform; animation: fall linear forwards; }
  .pt svg { display: block; animation: sway ease-in-out infinite alternate; }
  @keyframes fall { to { transform: translate3d(var(--drift), 112vh, 0) rotate(var(--spin)); } }
  @keyframes sway { from { transform: translateX(-18px) rotate(-25deg); } to { transform: translateX(18px) rotate(25deg); } }
  .pt.glowy svg { filter: drop-shadow(0 0 4px currentColor); }

  /* ---------- intro: envelope ---------- */
  .intro { display: grid; justify-items: center; gap: 22px; cursor: pointer; }
  .envelope-wrap { animation: float 3.2s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .envelope { position: relative; width: min(78vw, 330px); aspect-ratio: 1.55; perspective: 900px; filter: drop-shadow(0 18px 30px rgba(0,0,0,.35)); }
  .env-back, .env-front, .env-flap { position: absolute; inset: 0; border-radius: 10px; }
  .env-back { background: var(--env-back); }
  .env-peek { position: absolute; left: 7%; right: 7%; top: 8%; height: 80%; background: var(--paper); border-radius: 6px; transition: transform .8s cubic-bezier(.2,.8,.2,1) .35s; }
  .env-front { background: linear-gradient(160deg, var(--env-a), var(--env-b)); clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%); }
  .env-flap { background: linear-gradient(180deg, var(--flap-a), var(--flap-b)); clip-path: polygon(0 0, 100% 0, 50% 58%); transform-origin: top center; transition: transform .6s ease-in; z-index: 3; }
  .seal {
    position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; transform: translate(-50%, -50%);
    border-radius: 50%; background: radial-gradient(circle at 35% 35%, var(--seal-a), var(--seal-b) 70%);
    display: grid; place-items: center; font-size: 22px; z-index: 4;
    box-shadow: 0 3px 8px rgba(0,0,0,.35), inset 0 -3px 6px rgba(0,0,0,.3); transition: transform .4s ease, opacity .3s ease;
  }
  .env-to { position: absolute; left: 0; right: 0; bottom: 4%; text-align: center; z-index: 2; font-family: "Great Vibes", cursive; font-size: clamp(26px, 8vw, 34px); color: var(--env-ink); }
  .tap {
    color: var(--tap-ink); font-weight: 600; letter-spacing: .04em; font-size: 15px; padding: 10px 20px;
    border: 1px solid color-mix(in srgb, var(--tap-ink) 50%, transparent); border-radius: 999px;
    background: rgba(30, 12, 30, .35); backdrop-filter: blur(4px); animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.05); } }
  .opening .env-flap { transform: rotateX(180deg); z-index: 0; }
  .opening .seal { transform: translate(-50%, -50%) scale(0); opacity: 0; }
  .opening .env-peek { transform: translateY(-40%); }
  .opening.envelope-wrap { animation: none; }
  .gone { animation: drop .6s ease-in forwards !important; }
  @keyframes drop { to { transform: translateY(40vh) scale(.8); opacity: 0; } }

  /* ---------- intro: neon loading screen ---------- */
  .loading { position: fixed; inset: 0; z-index: 5; display: grid; place-content: center; justify-items: center; gap: 18px; text-align: center; padding: 24px; cursor: pointer; }
  .ld-title {
    font-family: "Bebas Neue", sans-serif; font-size: clamp(54px, 17vw, 96px); letter-spacing: .04em; line-height: .9; color: transparent;
    -webkit-text-stroke: 2px #ff3ea5; text-shadow: 0 0 12px rgba(255, 62, 165, .9), 0 0 32px rgba(255, 62, 165, .6); animation: flicker 3s infinite;
  }
  .ld-title small { display: block; font-size: .42em; -webkit-text-stroke: 1.5px #3ff3ff; text-shadow: 0 0 10px rgba(63, 243, 255, .9); letter-spacing: .25em; }
  @keyframes flicker { 0%, 18%, 22%, 62%, 66%, 100% { opacity: 1; } 20%, 64% { opacity: .35; } }
  .ld-for { font-family: "VT323", monospace; font-size: 24px; color: #ffe14d; letter-spacing: .08em; text-shadow: 0 0 8px rgba(255,225,77,.7); }
  .ld-bar { width: min(70vw, 280px); height: 10px; border: 2px solid #3ff3ff; border-radius: 3px; box-shadow: 0 0 10px rgba(63,243,255,.6); overflow: hidden; }
  .ld-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ff3ea5, #ffe14d); animation: load 2.6s steps(26) forwards; }
  @keyframes load { to { width: 100%; } }
  .ld-tip { font-family: "VT323", monospace; font-size: 20px; color: #f1d9ff; min-height: 26px; }
  .ld-start { font-family: "Bebas Neue", sans-serif; font-size: 30px; letter-spacing: .08em; color: #fff; background: transparent; border: 0; text-shadow: 0 0 10px #ff3ea5; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .flash { position: fixed; inset: 0; background: #fff; z-index: 9; pointer-events: none; animation: flashOut .5s ease-out forwards; }
  @keyframes flashOut { from { opacity: .9; } to { opacity: 0; } }

  /* ---------- intro: elevator ---------- */
  .elev { position: fixed; inset: 0; z-index: 5; display: grid; place-content: center; justify-items: center; gap: 16px; padding: 20px; }
  .elev-display {
    background: #0b0b0b; border: 3px solid #555d65; border-radius: 8px; padding: 4px 18px; min-width: 120px; text-align: center;
    font-family: "VT323", monospace; font-size: 40px; line-height: 1; color: #ffb020; text-shadow: 0 0 8px rgba(255,176,32,.8);
    box-shadow: inset 0 0 10px rgba(0,0,0,.9);
  }
  .elev-display .arr { font-size: 26px; vertical-align: 4px; margin-right: 8px; opacity: .35; }
  .elev.moving .elev-display .arr { opacity: 1; animation: blink .6s steps(2) infinite; }
  .elev-frame {
    position: relative; width: min(84vw, 360px); height: min(60svh, 520px);
    border: 10px solid #747d85; border-top-color: #8d969e; border-bottom-color: #5f676f; border-radius: 6px 6px 0 0; box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  .elev-doors { position: relative; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  .door {
    position: absolute; top: 0; bottom: 0; width: 50%;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.10) 0 1px, transparent 1px 4px), linear-gradient(90deg, #9aa3ab, #d9dee2 45%, #b5bcc3 70%, #8c949b);
    transition: transform 1.4s cubic-bezier(.6,0,.3,1);
  }
  .door.l { left: 0; border-right: 1px solid #6b737a; }
  .door.r { right: 0; border-left: 1px solid #e8ecef; }
  .elev.open .door.l { transform: translateX(-100%); }
  .elev.open .door.r { transform: translateX(100%); }
  .elev-call { display: grid; justify-items: center; gap: 10px; cursor: pointer; }
  .call-btn {
    width: 64px; height: 64px; border-radius: 50%; border: 5px solid #aab2b9; background: radial-gradient(circle at 40% 35%, #f4f6f8, #b9c0c6);
    font-size: 24px; color: #5f676f; display: grid; place-items: center; box-shadow: 0 4px 10px rgba(0,0,0,.4);
  }
  .elev.called .call-btn { color: #fff; background: radial-gradient(circle at 40% 35%, #ffd27a, #ff9d00); box-shadow: 0 0 22px rgba(255,170,0,.9); }
  .elev.open .elev-frame { transition: opacity .6s ease 1.2s; opacity: 0; }
  .elev.open .elev-display, .elev.open .elev-call { transition: opacity .4s ease; opacity: 0; }

  /* ---------- card (base = clasica) ---------- */
  .card {
    width: min(92vw, 430px); background: var(--paper); border-radius: 18px; position: relative;
    padding: 26px 24px; text-align: center; display: none;
    box-shadow: 0 30px 60px rgba(30, 8, 20, .45), 0 0 0 1px rgba(201, 154, 59, .25);
  }
  .card::before { content: ""; position: absolute; inset: 10px; border: 1.5px solid rgba(201, 154, 59, .55); border-radius: 12px; pointer-events: none; }
  .card.show { display: block; animation: rise .9s cubic-bezier(.2,.9,.25,1.15) both; }
  @keyframes rise { from { transform: translateY(30px) scale(.85) rotate(-2deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .art { margin: 0 auto 4px; }
  .art svg { width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto; }
  .card.show .pop { transform-box: fill-box; transform-origin: bottom center; animation: bounceIn .7s cubic-bezier(.3,1.6,.5,1) both; }
  .card.show .pop.d1 { animation-delay: .15s; } .card.show .pop.d2 { animation-delay: .3s; }
  @keyframes bounceIn { from { transform: scale(0); } }
  .card.show .fade { animation: fadeIn .8s ease .5s both; }
  .kicker:empty, .tagline:empty, .extra:empty { display: none; }
  .happy { font-family: "Great Vibes", cursive; color: var(--accent); font-size: clamp(44px, 14vw, 60px); line-height: 1; margin-top: 4px; }
  .thanks { font-family: "Playfair Display", serif; font-weight: 900; color: var(--ink); font-size: clamp(30px, 10.5vw, 46px); line-height: 1.05; white-space: nowrap; }
  .ch { display: inline-block; opacity: 0; }
  .card.show .happy .ch { animation: dropIn .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay: calc(.6s + var(--i) * 70ms); }
  .card.show .thanks .ch { animation: riseIn .55s cubic-bezier(.2,1.4,.4,1) both; animation-delay: calc(1.1s + var(--i) * 55ms); }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-40px) rotate(-12deg); } to { opacity: 1; transform: none; } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(24px) scale(.6); } to { opacity: 1; transform: none; } }
  .tagline { margin-top: 8px; font-style: italic; color: var(--muted); font-size: 16px; opacity: 0; }
  .card.show .tagline, .card.show .kicker, .card.show .extra { animation: fadeIn .7s ease 1.9s both; }
  .kicker, .extra { opacity: 0; }
  .divider { display: block; width: 120px; height: 14px; margin: 12px auto 8px; opacity: 0; }
  .card.show .divider { animation: fadeIn .6s ease 2s both; }
  .name {
    font-family: "Great Vibes", cursive; color: var(--name); font-size: clamp(42px, 13vw, 58px); line-height: 1.15;
    clip-path: inset(0 100% 0 0); padding: 0 8px; display: block; width: fit-content; margin: 0 auto; max-width: 100%;
  }
  .card.show .name { animation: write 1.6s ease-in-out 2.3s forwards; }
  @keyframes write { to { clip-path: inset(0 -10% 0 0); } }
  .dedication { font-size: 17px; line-height: 1.55; color: var(--body); margin: 10px 6px 0; }
  .w { display: inline-block; opacity: 0; white-space: pre; }
  .card.show .w { animation: wordIn .5s ease both; animation-delay: calc(3.8s + var(--i) * 75ms); }
  @keyframes wordIn { from { opacity: 0; transform: translateY(8px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
  .signature { font-family: "Great Vibes", cursive; font-size: 30px; color: var(--accent); margin-top: 12px; opacity: 0; }
  .card.show .signature { animation: fadeIn .9s ease both; animation-delay: var(--sig-delay, 4.4s); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .actions { margin-top: 18px; display: flex; justify-content: center; opacity: 0; }
  .card.show .actions { animation: fadeIn .6s ease both; animation-delay: calc(var(--sig-delay, 4.4s) + .8s); }
  .actions button { font: 600 14px "Nunito", sans-serif; color: var(--muted); background: transparent; border: 1px solid color-mix(in srgb, var(--muted) 45%, transparent); padding: 8px 16px; border-radius: 999px; cursor: pointer; }

  /* ================= THEME: neon ================= */
  body[data-theme="neon"] {
    --page-bg: linear-gradient(180deg, #0d0221 0%, #2a0845 40%, #6a0f5c 62%, #ff3ea5 82%, #ff9a3c 100%);
    --ink: #fff; --accent: #3ff3ff; --name: #ff3ea5; --body: #f3e6ff; --muted: #c7a6e6; --tap-ink: #fff;
  }
  .sun {
    position: absolute; left: 50%; bottom: 30vh; width: min(70vw, 340px); aspect-ratio: 1; transform: translate(-50%, 50%); border-radius: 50%;
    background: linear-gradient(180deg, #ffe14d 0%, #ff9a3c 45%, #ff3ea5 100%);
    -webkit-mask-image: linear-gradient(180deg, #000 52%, transparent 52% 56%, #000 56% 64%, transparent 64% 69%, #000 69% 76%, transparent 76% 82%, #000 82% 88%, transparent 88% 94%, #000 94%);
    mask-image: linear-gradient(180deg, #000 52%, transparent 52% 56%, #000 56% 64%, transparent 64% 69%, #000 69% 76%, transparent 76% 82%, #000 82% 88%, transparent 88% 94%, #000 94%);
    filter: drop-shadow(0 0 30px rgba(255, 62, 165, .7));
  }
  .grid {
    position: absolute; left: -50vw; bottom: 0; width: 200vw; height: 32vh;
    background: linear-gradient(180deg, #2a0845, #0d0221);
    background-image: linear-gradient(rgba(255,62,165,.9) 2px, transparent 2px), linear-gradient(90deg, rgba(255,62,165,.9) 2px, transparent 2px);
    background-size: 56px 56px; transform: perspective(260px) rotateX(62deg); transform-origin: bottom;
    animation: gridmove .9s linear infinite; -webkit-mask-image: linear-gradient(180deg, transparent, #000 12%); mask-image: linear-gradient(180deg, transparent, #000 12%);
  }
  .grid-base { position: absolute; left: 0; right: 0; bottom: 0; height: 32vh; background: #12002b; }
  @keyframes gridmove { to { background-position: 0 56px; } }
  .palm { position: absolute; bottom: 28vh; width: min(40vw, 190px); height: auto; }
  .palm.l { left: -4vw; } .palm.r { right: -4vw; transform: scaleX(-1); }
  body[data-theme="neon"] .card {
    background: rgba(16, 2, 40, .82); backdrop-filter: blur(6px); border: 2px solid #ff3ea5; border-radius: 14px;
    box-shadow: 0 0 16px rgba(255,62,165,.9), 0 0 46px rgba(63,243,255,.35), inset 0 0 24px rgba(255,62,165,.25);
  }
  body[data-theme="neon"] .card::before { border-color: rgba(63, 243, 255, .5); border-radius: 8px; }
  body[data-theme="neon"] .kicker { font-family: "VT323", monospace; font-size: 22px; color: #7dff7a; letter-spacing: .1em; text-shadow: 0 0 8px rgba(125,255,122,.8); margin-bottom: 2px; }
  body[data-theme="neon"] .happy { font-family: "Bebas Neue", sans-serif; font-size: clamp(30px, 9vw, 40px); letter-spacing: .3em; color: #3ff3ff; text-shadow: 0 0 10px rgba(63,243,255,.9); margin-top: 0; }
  body[data-theme="neon"] .thanks { font-family: "Bebas Neue", sans-serif; font-weight: 400; font-size: clamp(54px, 17vw, 78px); letter-spacing: .03em; color: #fff; text-shadow: 0 0 6px #ff3ea5, 0 0 18px #ff3ea5, 0 0 36px rgba(255,62,165,.7); line-height: .95; }
  body[data-theme="neon"] .tagline { font-style: normal; font-family: "VT323", monospace; font-size: 21px; color: #ffe14d; text-shadow: 0 0 6px rgba(255,225,77,.6); }
  body[data-theme="neon"] .extra { font-family: "VT323", monospace; font-size: 20px; color: #f3e6ff; margin-top: 4px; }
  body[data-theme="neon"] .extra .st { color: #ffe14d; text-shadow: 0 0 8px rgba(255,225,77,.9); display: inline-block; }
  body.neon-on .card.show .extra .st { animation: starPop .4s cubic-bezier(.3,1.8,.5,1) both; animation-delay: calc(2.2s + var(--i) * 120ms); }
  @keyframes starPop { from { transform: scale(0) rotate(-90deg); opacity: 0; } }
  body[data-theme="neon"] .name { font-family: "Yellowtail", cursive; text-shadow: 0 0 8px rgba(255,62,165,.9), 0 0 22px rgba(255,62,165,.6); }
  body[data-theme="neon"] .signature { font-family: "Yellowtail", cursive; color: #3ff3ff; text-shadow: 0 0 8px rgba(63,243,255,.8); font-size: 26px; }
  body[data-theme="neon"] .divider path:first-child { stroke: #3ff3ff; } body[data-theme="neon"] .divider path:last-child { fill: #ff3ea5; }
  .neon-badge { width: 92px; height: 92px; margin: 2px auto 6px; border-radius: 50%; border: 3px solid #3ff3ff; display: grid; place-items: center; font-size: 46px; box-shadow: 0 0 14px rgba(63,243,255,.9), inset 0 0 14px rgba(63,243,255,.5); }
  .card.show .neon-badge { animation: bounceIn .7s cubic-bezier(.3,1.6,.5,1) .2s both, spinGlow 4s ease-in-out 1s infinite; }
  @keyframes spinGlow { 50% { box-shadow: 0 0 26px rgba(255,62,165,.95), inset 0 0 18px rgba(255,62,165,.6); border-color: #ff3ea5; } }

  /* ================= THEME: familia ================= */
  body[data-theme="familia"] {
    --page-bg: linear-gradient(180deg, #24100b 0%, #4a1d12 45%, #8a3a1f 80%, #c4652f 100%);
    --paper: #fffaf2; --ink: #5b1a12; --accent: #9f2a1b; --name: #7f1d1d; --body: #4a2a1c; --muted: #8a5a3c;
    --env-a: #f3d7b4; --env-b: #e5bd8e; --env-back: #d6a872; --flap-a: #ecc794; --flap-b: #d9a66c; --seal-a: #2f6b3a; --seal-b: #173d1f;
  }
  body[data-theme="familia"] .card { padding-top: 34px; }
  body[data-theme="familia"] .card::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 16px; border-radius: 18px 18px 0 0;
    background: repeating-linear-gradient(90deg, rgba(159,42,27,.85) 0 10px, transparent 10px 20px), repeating-linear-gradient(0deg, rgba(159,42,27,.55) 0 8px, #fff6ea 8px 16px);
  }
  body[data-theme="familia"] .card::before { border-color: rgba(47, 107, 58, .35); top: 24px; }
  .win { animation: winGlow 2.6s ease-in-out infinite; }
  @keyframes winGlow { 50% { fill: #fde68a; } }
  .smoke { animation: smoke 3s ease-in infinite; transform-box: fill-box; transform-origin: center; }
  .smoke.s2 { animation-delay: 1.5s; }
  @keyframes smoke { from { transform: translateY(0) scale(.6); opacity: 0; } 30% { opacity: 1; } to { transform: translateY(-26px) scale(1.1); opacity: 0; } }

  /* ================= THEME: besties ================= */
  body[data-theme="besties"] {
    --page-bg: linear-gradient(160deg, #ffc8d8 0%, #ffe2c2 45%, #d8c8ff 100%);
    --paper: #ffffff; --ink: #3b2a4a; --accent: #e0457b; --name: #7c3aed; --body: #3b2a4a; --muted: #8b6f9e; --tap-ink: #5b3a7a;
    --env-a: #ffd1e1; --env-b: #ffb3cd; --env-back: #f79bbd; --flap-a: #ffc2d8; --flap-b: #f6a0c1; --seal-a: #8b5cf6; --seal-b: #5b21b6; --env-ink: #6d28d9;
  }
  body[data-theme="besties"] .tap { background: rgba(255,255,255,.55); }
  .doodles svg { position: absolute; opacity: .55; }
  body[data-theme="besties"] .card { border-radius: 6px; padding: 16px 16px 24px; transform-origin: center; box-shadow: 0 24px 50px rgba(90, 40, 110, .25); }

            clearInterval(t);
            box.classList.remove("moving");
            chime();
            setTimeout(() => { showCard(); box.classList.add("open"); }, reduce ? 0 : 350);
            setTimeout(() => { intro.innerHTML = ""; }, reduce ? 50 : 2300);
          }
        }, step);
      };
      $("callBox").addEventListener("click", go);
      $("callBox").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    } else {
      intro.innerHTML = `<div class="intro envelope-wrap" id="introBox" role="button" tabindex="0" aria-label="${L.aria}">
        <div class="envelope"><div class="env-back"></div><div class="env-peek"></div><div class="env-front"></div><div class="env-flap"></div>
          <div class="seal">${T.seal || "🍁"}</div><div class="env-to">${escapeHtml(who)}</div></div>
        <div class="tap">${L.tap}</div></div>`;
      const wrap = $("introBox");
      const go = () => {
        if (opened) return;
        opened = true;
        startAudio();
        wrap.classList.add("opening");
        setTimeout(() => wrap.classList.add("gone"), 1000);
        setTimeout(() => { intro.innerHTML = ""; showCard(); }, 1550);
      };
      wrap.addEventListener("click", go);
      wrap.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    }
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  function render() {
    const theme = THEMES[data.theme] ? data.theme : "clasica";
    const T = THEMES[theme];
    const lang = data.lang === "es" ? "es" : "en";
    const L = LABELS[lang];
    document.body.dataset.theme = theme;
    document.documentElement.lang = lang;
    $("scene").innerHTML = T.scene();
    pconf = T.particles;
    particlesEl.innerHTML = "";
    startParticles();

    $("art").innerHTML = T.art(lang);
    $("kicker").textContent = T.kicker ? T.kicker[lang] : "";
    $("tagline").textContent = T.tagline ? T.tagline[lang] : "";
    $("extra").innerHTML = T.extra ? T.extra(lang) : "";
    $("footer").innerHTML = T.footer ? T.footer(lang) : "";
    splitChars($("happy"), "Happy");
    splitChars($("thanks"), "Thanksgiving");
    $("name").textContent = data.display_name || "";
    $("name").style.display = data.display_name ? "block" : "none";
    fitName($("name"));
    const wordCount = data.dedication ? splitWords($("dedication"), data.dedication) : 0;
    $("dedication").style.display = data.dedication ? "block" : "none";
    const sigDelay = data.dedication ? 3.8 + wordCount * 0.075 + 0.6 : 4.0;
    $("card").style.setProperty("--sig-delay", sigDelay.toFixed(2) + "s");
    $("signature").textContent = data.signature ? "— " + data.signature : "";
    $("signature").style.display = data.signature ? "block" : "none";
    $("replayLabel").textContent = L.replay;

    const link = /open\.spotify\.com\/(?:intl-[a-z]{2}\/)?(track|album|playlist)\/([A-Za-z0-9]+)/.exec(data.spotify || "");
    if (link) data.spotify = "spotify:" + link[1] + ":" + link[2];
    if (data.spotify && SPOTIFY_URI.test(data.spotify)) {
      Spot.load(data.spotify, () => Music.start(document.body.dataset.theme));
    } else data.spotify = "";

    opened = false;
    $("card").classList.remove("show");
    document.body.classList.remove("neon-on");
    buildIntro(T, L);
  }

  $("replay").addEventListener("click", () => {
    const card = $("card");
    card.classList.remove("show");
    void card.offsetWidth;
    card.classList.add("show");
    burst(20);
  });

  async function load() {
    if (params.get("demo") === "1") {
      const t = THEMES[params.get("t")] ? params.get("t") : "clasica";
      const l = params.get("l") === "en" ? "en" : "es";
      data = { display_name: params.get("n") || "María", lang: l, theme: t, signature: l === "en" ? "Love, Javier" : "Con cariño, Javier",
        spotify: params.get("sp") || "",
        dedication: l === "en" ? "Thank you for always being there, for the laughs and the good times. Wishing you a table full of love and your favorite desserts." : DEMO[t] };
      render(); return;
    }
    if (!code) { render(); return; }
    try {
      const res = await fetch(cfg.SUPABASE_URL + "/rest/v1/rpc/open_card", {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: cfg.SUPABASE_ANON_KEY, Authorization: "Bearer " + cfg.SUPABASE_ANON_KEY },
        body: JSON.stringify({ p_code: code, p_track: !preview }),
      });
      const rows = res.ok ? await res.json() : [];
      if (rows && rows[0]) data = Object.assign(data, rows[0]);
    } catch (e) { /* show the generic card */ }
    data.dedication = data.dedication || "";
    data.signature = data.signature || "";
    data.spotify = data.spotify || "";
    render();
  }
  load();
})();
</script>
</body>
</html>
